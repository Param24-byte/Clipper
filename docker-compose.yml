version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Migrations (runs once, exits) ────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: >
      sh -c "alembic upgrade head"
    environment:
      DATABASE_SYNC_URL: postgresql+psycopg2://clipper:clipper@postgres:5432/clipper
      DATABASE_URL: postgresql+asyncpg://clipper:clipper@postgres:5432/clipper
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://clipper:clipper@postgres:5432/clipper
      DATABASE_SYNC_URL: postgresql+psycopg2://clipper:clipper@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ARTIFACT_STORAGE_BACKEND: local
      ARTIFACT_LOCAL_ROOT: /app/artifacts
      SECRET_KEY: dev-secret-key
    volumes:
      - artifact_data:/app/artifacts
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Worker ───────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://clipper:clipper@postgres:5432/clipper
      DATABASE_SYNC_URL: postgresql+psycopg2://clipper:clipper@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ARTIFACT_STORAGE_BACKEND: local
      ARTIFACT_LOCAL_ROOT: /app/artifacts
      SECRET_KEY: dev-secret-key
    volumes:
      - artifact_data:/app/artifacts
      - ./src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  artifact_data:
