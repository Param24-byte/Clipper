[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-editorial-clipper"
version = "0.0.1"
description = "AI-assisted long-form → short-form content engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
  # API
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  # Database
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  # Queue / worker
  "celery[redis]>=5.3.0",
  "redis>=5.0.0",
  # Utilities
  "python-ulid>=1.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
  "httpx>=0.27.0",
  "yt-dlp>=2023.11.16",
  "faster-whisper>=1.0.0",
  "opencv-python-headless>=4.9.0",
  "openai>=1.0.0",
  "google-generativeai>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
